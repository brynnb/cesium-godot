name: Locked cross-platform builds

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            precision: single
            artifact: godot3dtiles-linux-x86_64
          - name: Windows x86_64
            os: windows-2022
            platform: windows
            arch: x64
            precision: single
            artifact: godot3dtiles-windows-x86_64
          - name: Windows x86_64 double precision
            os: windows-2022
            platform: windows
            arch: x64
            precision: double
            artifact: godot3dtiles-windows-x86_64-double
          - name: macOS 15 arm64
            os: macos-15
            platform: macos
            arch: arm64
            precision: single
            artifact: godot3dtiles-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9

      - name: Set up MSVC 2022
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev pkg-config

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install locked build tools
        if: runner.os != 'macOS'
        run: python -m pip install scons==4.8.1 cmake==3.31.6 ninja==1.12.1

      - name: Install locked build tools on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install scons==4.8.1 cmake==3.31.6
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ninja-mac.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip
          echo "89a287444b5b3e98f88a945afa50ce937b8ffd1dcc59c555ad9b1baf855298c9  $RUNNER_TEMP/ninja-mac.zip" \
            | shasum --algorithm 256 --check
          mkdir -p "$RUNNER_TEMP/ninja-bin"
          unzip -q "$RUNNER_TEMP/ninja-mac.zip" -d "$RUNNER_TEMP/ninja-bin"
          chmod +x "$RUNNER_TEMP/ninja-bin/ninja"
          echo "$RUNNER_TEMP/ninja-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ninja-bin/ninja" --version

      - name: Cache locked vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dependencies/vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('dependencies.lock.json') }}

      - name: Verify arm64 macOS host
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Build locked extension
        env:
          CESIUM_GODOT_NATIVE_TESTS: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        run: >-
          python tools/build_extension.py
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --precision ${{ matrix.precision }}
          --jobs 4
          --json

      - name: Verify locked dependency trees after build
        run: python tools/bootstrap_dependencies.py --verify-only --json

      - name: Run Cesium Native tests
        if: runner.os == 'Linux'
        run: ctest --test-dir build/dependencies/native-build/x64-linux-release --output-on-failure

      - name: Check Linux shared-library resolution
        if: runner.os == 'Linux'
        run: |
          resolution="$(ldd -r godot3dtiles/addons/cesium_godot/lib/libGodot3DTiles.linux.template_release.x86_64.so 2>&1)"
          printf '%s\n' "$resolution"
          ! grep -q 'undefined symbol:' <<< "$resolution"

      - name: Download supported Godot test engines
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/test-engines/godot-4.6.3
          curl --fail --location --retry 3 --output build/test-engines/godot-4.6.3.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q build/test-engines/godot-4.6.3.zip -d build/test-engines/godot-4.6.3

      - name: Test Cesium for Godot on Godot 4.6.3
        if: runner.os == 'Linux'
        env:
          GODOT_BIN: ${{ github.workspace }}/build/test-engines/godot-4.6.3/Godot_v4.6.3-stable_linux.x86_64
        run: tests/run_godot_tests.sh

      - name: Upload distributable addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: godot3dtiles/addons/cesium_godot
          if-no-files-found: error
