name: Locked cross-platform builds

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Build from scratch without restoring or writing compilation caches
        type: boolean
        default: false
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  preflight:
    name: Source and dependency preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
      - name: Run fast source checks
        run: |
          python -m unittest -q tests.test_dependency_lock tests.test_build_configuration tests.test_bounded_test tests.test_ci_cache
          python tests/validate_source_layout.py

  build:
    needs: preflight
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            precision: single
            artifact: cesium-godot-linux-x86_64
          - name: Windows x86_64
            os: windows-2022
            platform: windows
            arch: x64
            precision: single
            artifact: cesium-godot-windows-x86_64
          - name: macOS 15 arm64
            os: macos-15
            platform: macos
            arch: arm64
            precision: single
            artifact: cesium-godot-macos-arm64
          - name: Android arm64
            os: ubuntu-24.04
            platform: android
            arch: arm64
            precision: single
            artifact: cesium-godot-android-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9

      - name: Set up MSVC 2022
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev pkg-config

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install locked build tools
        run: python -m pip install scons==4.11.1 cmake==4.4.3 ninja==1.13.0

      - name: Install locked Android NDK
        if: matrix.platform == 'android'
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            echo "sdkmanager was not found at $sdkmanager_bin" >&2
            exit 1
          fi
          "$sdkmanager_bin" --install "ndk;28.1.13356709"
          locked_ndk="$sdk_root/ndk/28.1.13356709"
          test -f "$locked_ndk/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_ROOT=$locked_ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$locked_ndk" >> "$GITHUB_ENV"

      - name: Configure short Windows dependency root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Draco 1.5.7 contains paths that exceed MSVC's effective limit when
          # vcpkg is nested under GitHub's workspace checkout.
          "CESIUM_GODOT_VCPKG_ROOT=$env:RUNNER_TEMP/cg-vcpkg" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare independent cache namespaces
        id: cache-keys
        if: github.event_name != 'schedule' && inputs.clean_build != true
        run: python tools/ci_cache.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Restore third-party package binaries
        id: vcpkg-cache
        if: github.event_name != 'schedule' && inputs.clean_build != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ci-cache/vcpkg
          key: packages-v2-${{ steps.cache-keys.outputs.vcpkg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: packages-v2-${{ steps.cache-keys.outputs.vcpkg }}-

      - name: Restore SCons compiled objects
        id: scons-cache
        if: github.event_name != 'schedule' && inputs.clean_build != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ci-cache/scons
          key: scons-v2-${{ steps.cache-keys.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scons-v2-${{ steps.cache-keys.outputs.compiler }}-

      - name: Restore Cesium Native compiler cache
        id: native-cache
        if: github.event_name != 'schedule' && inputs.clean_build != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ci-cache/sccache
          key: native-v2-${{ steps.cache-keys.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-v2-${{ steps.cache-keys.outputs.compiler }}-

      - name: Install pinned Native compiler cache
        if: github.event_name != 'schedule' && inputs.clean_build != true
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0

      - name: Verify arm64 macOS host
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Build locked extension
        env:
          CESIUM_GODOT_CLEAN_BUILD: ${{ (github.event_name == 'schedule' || inputs.clean_build == true) && 'true' || 'false' }}
          CESIUM_GODOT_NATIVE_TESTS: ${{ matrix.platform == 'linux' && 'true' || 'false' }}
        run: >-
          python tools/build_extension.py
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --precision ${{ matrix.precision }}
          --jobs 4
          --json

      - name: Validate Visual Studio 2026 solution generation
        if: runner.os == 'Windows'
        run: python tools/generate_visual_studio.py --json

      - name: Verify locked dependency trees after build
        run: python tools/bootstrap_dependencies.py --verify-only --json

      # Save only after a successful build and dependency verification, but
      # BEFORE tests: a failing test must not discard successful compilation.
      - name: Flush Native cache and report hits
        if: github.event_name != 'schedule' && inputs.clean_build != true
        run: sccache --stop-server

      - name: Save third-party package binaries
        if: github.event_name != 'schedule' && inputs.clean_build != true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ci-cache/vcpkg
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save SCons compiled objects
        if: github.event_name != 'schedule' && inputs.clean_build != true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ci-cache/scons
          key: ${{ steps.scons-cache.outputs.cache-primary-key }}

      - name: Save Cesium Native compiler cache
        if: github.event_name != 'schedule' && inputs.clean_build != true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ci-cache/sccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Run Cesium Native tests
        if: matrix.platform == 'linux'
        run: ctest --test-dir build/dependencies/native-build/x64-linux-release --output-on-failure --timeout 180

      - name: Check Linux shared-library resolution
        if: matrix.platform == 'linux'
        run: |
          resolution="$(ldd -r addons/cesium_godot/lib/libCesiumGodot.linux.template_release.x86_64.so 2>&1)"
          printf '%s\n' "$resolution"
          ! grep -q 'undefined symbol:' <<< "$resolution"

      - name: Verify Android ARM64 shared library
        if: matrix.platform == 'android'
        run: |
          library=addons/cesium_godot/lib/libCesiumGodot.android.template_release.arm64.so
          readelf -h "$library" | tee build/android-elf-header.txt
          grep -q 'Machine:.*AArch64' build/android-elf-header.txt
          readelf -d "$library" | tee build/android-dynamic-section.txt

      - name: Upload distributable addon for downstream testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            addons/cesium_godot
            !addons/cesium_godot/**/*.uid
            !addons/cesium_godot/**/*.import
          if-no-files-found: error

  runtime:
    name: ${{ matrix.platform }} ${{ matrix.suite }} Godot ${{ matrix.version }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, suite: runtime, version: '4.6.3'}
          - {os: ubuntu-24.04, platform: linux, suite: runtime, version: '4.7.2'}
          - {os: ubuntu-24.04, platform: linux, suite: editor, version: '4.6.3'}
          - {os: ubuntu-24.04, platform: linux, suite: editor, version: '4.7.2'}
          - {os: windows-2022, platform: windows, suite: editor, version: '4.6.3'}
          - {os: windows-2022, platform: windows, suite: editor, version: '4.7.2'}
    steps:
      - name: Checkout same revision as build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
      - name: Download built addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cesium-godot-${{ matrix.platform }}-x86_64
          path: addons/cesium_godot
      - name: Recover locked source fixtures without recompiling
        if: matrix.suite == 'runtime'
        run: python tools/bootstrap_dependencies.py --json
      - name: Download supported Godot test engine
        run: python tools/download_test_engine.py --version ${{ matrix.version }}
      - name: Run full runtime suite
        if: matrix.suite == 'runtime'
        run: tests/run_godot_tests.sh
      - name: Run Linux editor and OAuth tests
        if: matrix.platform == 'linux' && matrix.suite == 'editor'
        run: tests/run_editor_tests.sh
      - name: Test packaged addon on Godot 4.6.3 for Windows
        if: matrix.platform == 'windows' && matrix.version == '4.6.3'
        shell: pwsh
        run: |
          python tests/run_bounded_test.py $env:GODOT_BIN --headless --path examples/lifecycle_material_demo -- --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Windows lifecycle/material smoke test failed" }
      - name: Run Windows editor tests
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./tests/run_editor_tests.ps1 -GodotBin $env:GODOT_BIN
      - name: Test ZIP installation and saved scene
        if: matrix.suite == 'editor'
        shell: bash
        run: python tests/run_packaged_editor_test.py --godot "$GODOT_BIN"

  managed:
    name: ${{ matrix.platform }} LibGodot C# tests
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: windows-2022, platform: windows}
    steps:
      - name: Checkout same revision as build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download built addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cesium-godot-${{ matrix.platform }}-x86_64
          path: addons/cesium_godot
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Run Linux LibGodot tests
        if: matrix.platform == 'linux'
        run: tests/run_2dog_tests.sh
      - name: Run Windows LibGodot tests
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./tests/run_2dog_tests.ps1

  validation:
    name: All platform builds and tests passed
    if: always()
    needs: [build, runtime, managed]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and test job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(v["result"] == "success" for v in results.values()), results'
